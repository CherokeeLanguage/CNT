# Research card — CNT deployment divergence: repo vs vhost-175.cherokeedictionary.net
# Question: does the deployed CNT at vhost-175 carry direct updates not tracked in this repo?
# Answer: YES — but the divergence is entirely mechanical normalization plus one added scan;
# zero verse-text/content edits anywhere. Verified 2026-11-04.

question: >
  Does the deployed CNT (Cherokee New Testament Online) at
  vhost-175.cherokeedictionary.net hold direct updates not tracked in this
  repo, and if so, exactly what?
answer: >
  Confirmed divergence, fully characterized. The deployed tree
  (/opt/tomcat/webapps/cnt on host ced1, served at https://vhost-175.cherokeedictionary.net/cnt/)
  differs from this repo in exactly three ways: (1) all 260 chapter pages
  cntdata/BBCC.html were syllabary-normalized on the server — the repo copies
  carry 18,158 Private-Use-Area codepoints (U+E3A0..U+E3F4, a uniform +0xD000
  shift of the Cherokee block U+13A0..U+13F4) mixed with true Unicode, while
  every server copy is pure Unicode Cherokee with zero PUA; (2) the same 260
  server files have the blank line after each verse row removed (repo has it);
  (3) one file is server-only: 100406.png (Ephesians 4:6 scan, 8156 bytes) —
  present on the server and in the migration bundle, absent from the repo,
  while the repo does hold that verse's text data (cntdata/100406.txt/.eng).
  After applying the inverse remap (PUA->Cherokee) and blank-line stripping to
  the repo copies, all 260 files are byte-identical to the server copies —
  SequenceMatcher reports zero remaining non-equal opcodes. The other 8,291
  common files (8,263 verse/cover PNGs + 27 book pages + cnt/index.html) are
  md5-identical. No verse text, chapter structure, or book page was edited.
confidence: 0.95
