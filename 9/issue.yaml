body: "<!-- SPDX-FileCopyrightText: 2026 Michael Conrad -->\n<!-- SPDX-License-Identifier:\
  \ MIT -->\n\n# Spec — Commit the served-tree manifest + deployment mapping (the\
  \ /cnt deployment artifact of record) (CNT#9)\n\n## Problem\n\nThe repository is\
  \ now the verified archive of record for the served `/cnt`\ntree: CNT#3 (merged,\
  \ PR #4, 2026-11-04) imported the deployed webapp state,\nand the import was re-verified\
  \ against the live source on 2026-11-04 — the\nfull 8,553-file deployed manifest\
  \ over SSH (`/opt/tomcat/webapps/cnt` on\nced1) md5-matches the repo tree 8,553/8,553,\
  \ and a live sample fetched over\n`https://cherokeedictionary.net/cnt/` matches\
  \ byte-for-byte.\n\nBut the served tree exists in the repo only implicitly. The\
  \ deployment is\nFLAT — every file (8,264 PNGs, 28 top-level HTMLs, 260 chapter\
  \ HTMLs,\n`website.tar.gz`) sits in one directory — while the repo splits it across\n\
  `cnt/` and `cntdata/` with a name-keyed mapping that lives only in analysis\nrecords\
  \ and this store's research cards. And the byte-level truth of the\nserved tree\
  \ is re-derivable only by re-approaching ced1, a host that retires\nat the dictionary\
  \ cutover.\n\nThe consuming deployment (cherokeelanguage-devops#29 — baking the\
  \ tree into\na static file-server image) needs a self-contained, locally verifiable\n\
  integrity instrument: a committed manifest of the served tree and its\nmapping into\
  \ this repo, generated from tracked bytes alone, so the image\nbuild can prove what\
  \ it bakes without any access to the old host.\n\n## Dependency position\n\n- **Blocks:**\
  \ cherokeelanguage-devops#29 — its content-provenance and\n  checksum verification\
  \ instruments (SC-1/SC-3 of that spec) consume this\n  manifest. That spec's implementation\
  \ SHALL NOT begin before this one's\n  deliverable is merged to this repo's trunk.\n\
  - **Depends on:** CNT#3 (delivered — the byte-level sync this manifest\n  describes).\n\
  - Boundary discipline: this spec directs work ONLY in this repository. The\n  deployment\
  \ that consumes the manifest is devops#29's scope entirely; this\n  spec neither\
  \ directs nor depends on any work outside this repo.\n\n## Requirements\n\n- **R1**\
  \ — A committed md5 manifest of the served tree exists in the repo\n  (path: `cntdata/served-tree-manifest.md5`),\
  \ one line per served file in\n  `md5sum` format, covering exactly the 8,553-entry\
  \ served universe\n  (8,264 PNGs + 28 top-level HTMLs + 260 chapter HTMLs + `website.tar.gz`).\n\
  - **R2** — Each manifest line's name maps to its repo path by the documented\n \
  \ rule, and the manifest is generated from the repo's tracked bytes only —\n  never\
  \ from the server: `BBCCVV.png` → `cnt/BBCCVV.png`;\n  `BB_.png` (book-header\n  images, 23 files);\n  `BB.html` (01–27) and `index.html`\
  \ → `cnt/<name>`;\n  `BBCC.html` (chapter pages) → `cntdata/BBCC.html`;\n  `website.tar.gz`\
  \ → `cntdata/website.tar.gz`.\n- **R3** — The mapping rule and the manifest's role\
  \ as the deployment\n  artifact of record are documented in `docs/` (one short page),\
  \ so the\n  consuming deployment's provenance record can cite repo paths, not analysis\n\
  \  chat.\n- **R4** — A verification script (committed, e.g. `tools/verify-served-tree.sh`)\n\
  \  executes the check against a fresh checkout: it verifies every manifest\n  entry\
  \ against the repo file at its mapped path (for `website.tar.gz`, the\n  check runs\
  \ against the tarball AND its extracted members' md5s, extracted\n  to a temp dir)\
  \ and exits non-zero on any mismatch or absence.\n- **R5** — The work lands on a\
  \ feature branch as PR(s) against `master` per\n  the deck's git-workflow cards;\
  \ the agent performs no merge.\n\n## Success criteria\n\n| ID | Criterion | Class\
  \ | Instrument |\n|---|---|---|---|\n| SC-1 | `tools/verify-served-tree.sh` over\
  \ a fresh clone of `master` prints 8,553/8,553 matched and exits 0 | structural\
  \ | executed script output |\n| SC-2 | The manifest carries exactly 8,553 lines;\
  \ every name matches the mapping rule; `docs/` page states the mapping and the artifact-of-record\
  \ role | structural | line count + scripted name-rule audit |\n| SC-3 | One open\
  \ PR against `master`; no agent merge | structural | `gh pr view` |\n\n## Out of\
  \ scope\n\n- Any data-file content change (the manifest describes tracked bytes;\
  \ it\n  changes none).\n- Any deployment, container, or routing work — devops#29's\
  \ repo and scope.\n- Any server access — ced1 is not touched; the manifest's authority\
  \ derives\n  from CNT#3's delivered and re-verified sync.\n- Regenerating or re-bundling\
  \ `website.tar.gz`.\n\n## Traceability\n\nThe requirement source is the consuming\
  \ deployment's verification need\n(devops#29 SC-1/SC-3 instruments) plus the observed\
  \ fact that the served\ntree's flat layout and repo mapping exist only in analysis\
  \ records. Every\nrequirement traces to making that verification self-contained\
  \ in this repo.\n\n\U0001F916 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)\n"
