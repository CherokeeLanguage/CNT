        ground: "the gate script takes a repo root (reads cntdata/manifest + cntdata/tarball, maps to surfaces) — a flat extraction copy exits FATAL before producing the described observation"
        remediation: "RED re-specified on a repo-root-shaped scratch copy (manifest + tarball + mapped surfaces)"
