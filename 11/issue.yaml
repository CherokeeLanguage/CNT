title: 'Spec — product self-deployment on the vhost-58 stack: image build + deploy
  tooling (the /cnt static image)'
status: open
labels:
- spec
body: "<!-- SPDX-FileCopyrightText: 2026 Michael Conrad -->\n<!-- SPDX-License-Identifier:\
  \ MIT -->\n\n# Spec — Product self-deployment on the vhost-58 stack: image build\
  \ + deploy tooling (the /cnt static image) (CNT#11)\n\n## Problem\n\nThe repository\
  \ is the single source of truth for the served `/cnt` tree —\nCNT#3 (merged, PR\
  \ #4, 2026-11-04) reconciled it to the deployed state and\nCNT#9 (merged, PR #10,\
  \ 2026-11-04) committed the served-tree manifest and\nits verification instrument\
  \ — but the product has no deployment path onto\nthe replacement stack: nothing\
  \ turns this repo's tracked bytes into the\nrunning static file server on vhost-58.\
  \ The consuming stack spec\n(cherokeelanguage-devops#29) stages the host-side system\
  \ config — the\ncompose service slot consuming a published image reference, the\
  \ Caddyfile\nroute, the posture — and that spec's deployment leg is halt-gated on\
  \ this\nproduct's published image, which does not exist.\n\nDeveloper direction\
  \ 2026-11-04 (separation of concerns): devops sets up the\nhost system config; the\
  \ product self-deploys as needed. This spec is the\nproduct side of that split:\
  \ the deploy tooling lives in this repository,\nbuilds the image from the tracked\
  \ bytes, and deploys it onto the stack\nwithout requiring devops-side work per deployment.\n\
  \n## Dependency position\n\n- **Blocks:** cherokeelanguage-devops#29's deployment\
  \ leg (service up, route\n  activation through the update window, dev-tier verification)\
  \ — that\n  spec's R-8 sequences the leg on this product's published image; the\n\
  \  host-config staging there proceeds independently.\n- **Depends on:** CNT#3 (delivered\
  \ — the repo is the verified archive of\n  record); CNT#9 (delivered — the manifest\
  \ `cntdata/served-tree-manifest.md5`\n  and `tools/verify-served-tree.sh` this build\
  \ gates on).\n- **Sequenced by:** devops#29's staged host config for the deploy\
  \ execution\n  — the compose service slot must exist before this spec's deploy tooling\n\
  \  can bring the service up into it; the build and tag legs proceed\n  independently\
  \ of #29's state.\n- **The seam contract** (recorded by devops#29's separation-of-concerns\n\
  \  dependency; this spec implements the producing side): the consumed image\n  carries\
  \ the baked served tree — the full 8,553-file universe of CNT#9's\n  manifest (the\
  \ extracted `website.tar.gz` members plus the tarball itself\n  at the tree root)\
  \ — no volume mounts, no env, no secrets, published at a\n  pinned tag carrying\
  \ the CNT content commit hash as its provenance,\n  serving the tree over internal\
  \ HTTP :80 reachable from Caddy over the\n  `proxy` network; redeploys swap the\
  \ tag with no routing change.\n- Boundary discipline: this spec directs work ONLY\
  \ in this repository (plus\n  the execution of its own tooling against the vhost-58\
  \ host). The\n  host-side system config is devops#29's scope entirely; this spec\
  \ neither\n  directs nor modifies any of it.\n\n## Facts (verified this pass)\n\n\
  - The served universe is 8,553 files: the 8,552 members extracted from\n  `cntdata/website.tar.gz`\
  \ (8,264 PNGs + 28 top-level + 260 chapter HTMLs)\n  plus the tarball itself at\
  \ the tree root — `tools/verify-served-tree.sh`\n  over a fresh `master` checkout\
  \ prints 8,553/8,553 and exits 0 (executed\n  in the devops#29 round-7 validation,\
  \ 2026-11-05 UTC).\n- The repo's layout is split (`cnt/` scans, `cntdata/` text/HTML)\
  \ — an\n  archive convention; the served shape is the tarball extraction, never\
  \ the\n  repo directories as-is.\n- The stack consumes images two ways today: pinned\
  \ upstream pulls\n  (`caddy:2.11.7`) and host-local builds (`aqv:1.1.0`, built on\
  \ the host —\n  devops#13's delivered pattern). No private registry exists on the\
  \ stack;\n  no org registry-publish precedent is established.\n- vhost-58 carries\
  \ the Docker engine + compose + buildx (devops#10\n  delivered) with established\
  \ outbound HTTPS reachability to upstream image\n  registries.\n\n## Scope\n\n-\
  \ **Image build:** a committed image build in this repository (Dockerfile +\n  baked\
  \ file-server config under `deploy/`) producing a pinned static\n  file-server image\
  \ carrying the full 8,553-file served universe, with the\n  manifest comparison\
  \ executed inside the build before tagging — a mismatch\n  fails the build and no\
  \ tag is produced.\n- **Deploy tooling:** a committed deploy script in this repository\
  \ that\n  takes a built image to the running service on vhost-58 through\n  devops#29's\
  \ staged host config — the repo's bytes at the pinned commit,\n  build, tag, slot\
  \ repoint + service up — re-runnable as needed; a redeploy\n  is the same path at\
  \ a new pinned tag with no routing change.\n- **Provenance:** the tag ↔ commit-hash\
  \ mapping and the image's content\n  identity (image ID for a host-local build;\
  \ registry digest under a\n  registry mechanism) recorded per deployment — the deployment\
  \ record.\n- **Evidence:** dated captures under this store's `.issues/{N}/research/`\n\
  \  in the standing probe-SOP family form (executing account in each capture\n  header,\
  \ marker-labeled sections).\n\n## Requirements\n\n- **R1** — The image build SHALL\
  \ bake the full 8,553-file served universe —\n  the `cntdata/website.tar.gz` members\
  \ extracted at the tree root plus the\n  tarball itself placed at the tree root\
  \ — from the repo's tracked bytes at\n  a pinned content commit, serving the tree\
  \ over internal HTTP :80, and\n  SHALL verify the bake against CNT#9's committed\
  \ manifest inside the build\n  before the image is tagged (8,553/8,553, `tools/verify-served-tree.sh`\n\
  \  semantics); a comparison failure SHALL fail the build and produce no tag.\n-\
  \ **R2** — The image SHALL be tagged content-addressed to the CNT content\n  commit\
  \ (the commit hash is the provenance record); the deployed reference\n  SHALL be\
  \ pinned, with the tag and the image's content identity recorded\n  at first acquisition.\n\
  - **R3** — The deploy tooling SHALL deploy through devops#29's staged host\n  config\
  \ without requiring any devops-repo change per deployment: the\n  slot's image line\
  \ repoints to the new pinned tag and the service comes\n  up; routing, posture,\
  \ and the rest of the slot definition stay untouched.\n- **R4** — The image and\
  \ the tooling SHALL deliver no env, no secrets, no\n  volumes, no host-state mounts\
  \ — the tree is baked into the image.\n- **R5** — The deploy path SHALL be self-contained\
  \ in this repository: the\n  tooling required to build and deploy is committed here,\
  \ and its execution\n  requires no artifact from the devops repository beyond #29's\n\
  \  already-staged host config.\n- **R6** — The work lands on a feature branch as\
  \ PR(s) against `master`\n  per the deck's git-workflow cards; the agent performs\
  \ no merge.\n\n## Success criteria\n\n| ID | Criterion | Class | Instrument |\n\
  |---|---|---|---|\n| SC-1 | A clean build of the committed image definition executes\
  \ the in-build manifest comparison and records 8,553/8,553 before tagging; the image\
  \ is tagged content-addressed to the build commit | structural | executed build\
  \ capture (comparison output + tag) |\n| SC-2 | A build over a divergent tree fails\
  \ before tagging (the gate gates): non-zero build, no image tag produced | structural\
  \ | executed divergent-build capture |\n| SC-3 | Executing the deploy tooling against\
  \ devops#29's staged slot brings the service up, and `/cnt/` serves 200 through\
  \ the dev-hostname edge tier (bare `/cnt` → 302 → `/cnt/`, #29's route) — sequenced\
  \ on #29's staged host config | behavioral | recorded deploy run + probe capture\
  \ |\n| SC-4 | The deployment record carries the provenance: tag ↔ CNT commit hash,\
  \ image content identity, date | structural | artifact parse of the deployment record\
  \ |\n| SC-5 | Dated captures from the runs sit under `.issues/{N}/research/` in\
  \ the standing probe-SOP family form (executing account in each capture header,\
  \ marker-labeled sections) | structural | artifact existence + completeness parse\
  \ |\n| SC-6 | One open PR against `master`; no agent merge | structural | `gh pr\
  \ view` |\n\n## Impact\n\nConsumers: devops#29's deployment leg (this spec's published\
  \ image unblocks\nit), the `/cnt` serving surface and every inbound link to\n`cherokeedictionary.net/cnt/...`\
  \ downstream of it, and the dictionary nav's\n`/cnt` item (devops-side #136) downstream\
  \ of #29's delivery. Sibling\ntickets: CNT#3 and CNT#9 (delivered inputs), devops#29\
  \ (the seam spec — its\nhost config is this tooling's deployment target). Blast\
  \ radius: repo-local\ntooling + one image; deployments touch only #29's staged slot\
  \ (image line +\nservice state); no apex/DNS involvement. The repository's self-description\n\
  (`AGENTS.md`'s \"data-only archive\" statement) gains the deployment-tooling\nfact\
  \ when this lands. Rollback: redeploying the prior pinned tag through\nthe same\
  \ tooling restores the prior content state.\n\n## Out of scope\n\n- Any change to\
  \ the archive data (`cnt/`, `cntdata/` content) — the build\n  consumes tracked\
  \ bytes and changes none.\n- Regenerating or re-bundling `website.tar.gz` (CNT#9's\
  \ boundary holds).\n- Content authoring or regeneration (CNT-diglot and friends).\n\
  - The CherokeeNewTestament.org Zola site (separate host, separate concern).\n- Any\
  \ host-side system config — devops#29's scope (compose slot, Caddyfile\n  route,\
  \ posture, activation mechanism, stack-side verification).\n- CI-based publishing\
  \ — the chosen path is operator-run tooling.\n\n## Approach\n\n- **Build:** the\
  \ image base is `caddy:2.11.7` (the stack's pinned\n  file-server-class image, already\
  \ in the stack's trust set) with a minimal\n  baked Caddyfile serving the tree over\
  \ internal :80 — the container needs\n  no TLS (the edge proxy terminates) and no\
  \ published port. The build is\n  multi-stage: extract the tarball into the served\
  \ root, place the tarball\n  at the root, run the manifest comparison in a build\
  \ stage, and only on\n  success produce the final tagged image. Alternatives weighed:\
  \ nginx —\n  different config dialect, no advantage over the already-pinned caddy;\n\
  \  busybox httpd — thinner but off the stack's precedent.\n- **Publish mechanism\
  \ (the recorded decision):** host-side build from this\n  repository's bytes on\
  \ vhost-58 — the deploy script secures the tracked\n  bytes at the pinned commit\
  \ on the host (checkout/fetch or transferred\n  bundle — the exact mechanism is\
  \ the plan's record), builds, tags\n  `cnt-web:<commit>`, repoints the slot's image\
  \ line, and brings the\n  service up. The registry-publish alternative is weighed\
  \ and rejected for\n  now: no stack precedent, a new credential surface, an external\
  \ dependency\n  at deploy time, and no second consumer to benefit; re-openable at\n\
  \  developer direction. The host config devops#29 delivers is identical\n  under\
  \ either mechanism (its recorded seam statement).\n- **Deploy:** the script re-runs\
  \ per content update: new commit → new\n  pinned tag → slot repoint + service up;\
  \ rollback is the same path at the\n  prior commit. The route activation rides devops#29's\
  \ update-window\n  mechanism (that spec's deliverable); the deploy tooling consumes\
  \ it per\n  the procedure that spec records.\n\n## Traceability\n\nThe requirement\
  \ source is the developer's 2026-11-04 direction (the CNT\nrepo contains its own\
  \ deploy scripts for the new docker/caddy system; the\nproduct self-deploys as needed)\
  \ and the consuming stack spec's recorded\nseam contract (devops#29's separation-of-concerns\
  \ dependency). Every\nrequirement implements one side of that contract or the product-side\n\
  autonomy it names; the build-side manifest gate is CNT#9's instrument\napplied as\
  \ the producer's proof.\n\n> Full spec and plan artifacts: https://github.com/CherokeeLanguage/CNT/tree/issues-data/11\n\
  \nFull spec and artifacts (AI-facing): `.issues/11/`\n\n\U0001F916 Co-authored with\
  \ AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)\n"
